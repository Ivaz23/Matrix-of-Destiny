<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18132b"/>
      <stop offset="70%" stop-color="#070b14"/>
      <stop offset="100%" stop-color="#020408"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle for Android adaptive icon -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Outer Sacred Geometry Ring -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#goldGrad)" stroke-width="3" stroke-dasharray="8 6" opacity="0.5"/>
  <circle cx="256" cy="256" r="185" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4"/>
  <circle cx="256" cy="256" r="140" fill="none" stroke="url(#goldGrad)" stroke-width="1" opacity="0.3"/>
  
  <!-- Octagram / Matrix Star -->
  <g transform="translate(256, 256)" stroke="url(#goldGrad)" stroke-width="2" fill="none" opacity="0.6">
    <rect x="-115" y="-115" width="230" height="230" />
    <rect x="-115" y="-115" width="230" height="230" transform="rotate(45)" />
    <!-- Diagonal Lines -->
    <line x1="-150" y1="-150" x2="150" y2="150" stroke-width="1" opacity="0.4" />
    <line x1="-150" y1="150" x2="150" y2="-150" stroke-width="1" opacity="0.4" />
    <line x1="0" y1="-165" x2="0" y2="165" stroke-width="1" opacity="0.4" />
    <line x1="-165" y1="0" x2="165" y2="0" stroke-width="1" opacity="0.4" />
  </g>

  <!-- Center Glowing Core Circle -->
  <circle cx="256" cy="256" r="75" fill="#070b14" stroke="url(#goldGrad)" stroke-width="3" filter="url(#glow)"/>

  <!-- Sacred "C" Monogram -->
  <text x="256" y="280" font-family="'Cinzel', 'Georgia', 'serif'" font-size="78" font-weight="900" text-anchor="middle" fill="url(#goldGrad)" filter="url(#glow)">C</text>

  <!-- Cardinal Star Points -->
  <circle cx="256" cy="71" r="5" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="256" cy="441" r="5" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="71" cy="256" r="5" fill="#fbbf24" filter="url(#glow)" />
  <circle cx="441" cy="256" r="5" fill="#fbbf24" filter="url(#glow)" />
</svg>
